group 'dev.isar.isar_flutter_libs'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'dev.isar.isar_flutter_libs'
    }
    
    // Specify NDK version that supports 16KB page size alignment
    ndkVersion "29.0.14206865"
    
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 26
        
        // Support for 16KB page size
        ndk {
            // Ensure all ABIs are built with 16KB page size support
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }
    
    packagingOptions {
        // Ensure native libraries support 16KB page size
        jniLibs {
            useLegacyPackaging = false
        }
    }
}